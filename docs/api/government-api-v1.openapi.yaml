openapi: 3.0.3
info:
  title: Funda360 Government Data & Integration API
  version: 1.0.0
  description: |
    Versioned, scope-aware access to Funda360 government reporting data.
    Integration-ready only: no connection to DBE, SA-SAMS, LURITS or any other
    government system exists or is implied. See docs/GOVERNMENT_API.md.

    Every figure uses the same definitions as the Funda360 District and
    Provincial Dashboards. Scope is enforced in the database: query
    parameters can only narrow it.
servers:
  - url: https://{projectRef}.supabase.co/functions/v1/government-api
    variables:
      projectRef:
        default: rzkybmkzhpwovpvrjkxk
security:
  - bearerToken: []
tags:
  - name: Scope
  - name: Schools
  - name: Learners
  - name: Aggregates
  - name: Reports
  - name: Imports
paths:
  /v1/scope:
    get:
      tags: [Scope]
      summary: The calling client, its scope and permissions
      responses:
        '200':
          description: Client description
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      client:
                        type: object
                        properties:
                          id: { type: string, format: uuid }
                          name: { type: string }
                          permissions: { type: array, items: { $ref: '#/components/schemas/Permission' } }
                          learner_detail: { type: boolean }
                          rate_limit_per_minute: { type: integer }
                          expires_at: { type: string, format: date-time, nullable: true }
                      scope:
                        type: object
                        properties:
                          type: { type: string, enum: [province, district, circuit, school] }
                          id: { type: string, format: uuid }
                          name: { type: string }
                      schools: { type: integer }
        default: { $ref: '#/components/responses/Error' }
  /v1/areas:
    get:
      tags: [Scope]
      summary: Education areas visible to the client (ancestors are named, not in scope)
      responses:
        '200':
          description: Areas
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Area' }
        default: { $ref: '#/components/responses/Error' }
  /v1/schools:
    get:
      tags: [Schools]
      summary: School directory in scope
      description: Requires the `schools` permission.
      parameters:
        - $ref: '#/components/parameters/province_id'
        - $ref: '#/components/parameters/district_id'
        - $ref: '#/components/parameters/circuit_id'
        - { name: status, in: query, schema: { type: string, enum: [active, inactive, suspended] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: One page of schools ordered by id
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/School' } }
        default: { $ref: '#/components/responses/Error' }
  /v1/schools/{id}:
    get:
      tags: [Schools]
      summary: One school (403 for unknown or out-of-scope ids)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: School
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/School' }
        default: { $ref: '#/components/responses/Error' }
  /v1/learners:
    get:
      tags: [Learners]
      summary: Enrolments for one school (no names, dates of birth or identity numbers)
      description: Requires the `learners` permission and the client's learner-level grant. Every call is audited.
      parameters:
        - { name: school_id, in: query, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/academic_year'
        - $ref: '#/components/parameters/grade'
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 200 } }
        - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: One page of enrolments ordered by learner id
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            learner_id: { type: string, format: uuid }
                            learner_number: { type: string }
                            school_id: { type: string, format: uuid }
                            academic_year: { type: string, nullable: true }
                            grade: { type: string }
                            class_id: { type: string, format: uuid, nullable: true }
                            class: { type: string, nullable: true }
                            enrollment_status: { type: string }
                            learner_status: { type: string }
                            enrollment_date: { type: string, format: date }
        default: { $ref: '#/components/responses/Error' }
  /v1/attendance:
    get:
      tags: [Aggregates]
      summary: Attendance totals and periods per school
      description: "Requires `attendance`. Rate = (present + late) / (present + late + absent); excused days excluded."
      parameters:
        - $ref: '#/components/parameters/province_id'
        - $ref: '#/components/parameters/district_id'
        - $ref: '#/components/parameters/circuit_id'
        - $ref: '#/components/parameters/school_id'
        - $ref: '#/components/parameters/academic_year'
        - $ref: '#/components/parameters/term'
        - $ref: '#/components/parameters/start_date'
        - $ref: '#/components/parameters/end_date'
        - $ref: '#/components/parameters/grade'
        - { name: granularity, in: query, schema: { type: string, enum: [week, month], default: month } }
        - $ref: '#/components/parameters/school_limit'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: One page of schools
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      granularity: { type: string }
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            school_id: { type: string, format: uuid }
                            academic_year: { type: string, nullable: true }
                            period_start: { type: string, format: date, nullable: true }
                            period_end: { type: string, format: date, nullable: true }
                            totals: { $ref: '#/components/schemas/AttendanceCounts' }
                            periods:
                              type: array
                              items:
                                allOf:
                                  - $ref: '#/components/schemas/AttendanceCounts'
                                  - type: object
                                    properties:
                                      period: { type: string, format: date }
        default: { $ref: '#/components/responses/Error' }
  /v1/assessments:
    get:
      tags: [Aggregates]
      summary: Assessment results per school and subject
      description: Requires `assessments`. Groups of fewer than 5 learners are withheld without learner-level access.
      parameters:
        - $ref: '#/components/parameters/province_id'
        - $ref: '#/components/parameters/district_id'
        - $ref: '#/components/parameters/circuit_id'
        - $ref: '#/components/parameters/school_id'
        - $ref: '#/components/parameters/academic_year'
        - $ref: '#/components/parameters/term'
        - $ref: '#/components/parameters/start_date'
        - $ref: '#/components/parameters/end_date'
        - $ref: '#/components/parameters/grade'
        - { name: performance_threshold, in: query, schema: { type: number, minimum: 0, maximum: 100, default: 50 } }
        - $ref: '#/components/parameters/school_limit'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: One page of schools
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            school_id: { type: string, format: uuid }
                            subjects:
                              type: array
                              items:
                                type: object
                                properties:
                                  subject: { type: string }
                                  learners: { type: integer }
                                  assessment_results: { type: integer }
                                  suppressed: { type: boolean }
                                  average_percent: { type: number, nullable: true }
                                  pass_rate: { type: number, nullable: true }
        default: { $ref: '#/components/responses/Error' }
  /v1/staff:
    get:
      tags: [Aggregates]
      summary: Staff and educator counts per school
      parameters:
        - $ref: '#/components/parameters/province_id'
        - $ref: '#/components/parameters/district_id'
        - $ref: '#/components/parameters/circuit_id'
        - $ref: '#/components/parameters/school_id'
        - $ref: '#/components/parameters/academic_year'
        - $ref: '#/components/parameters/school_limit'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200': { $ref: '#/components/responses/SchoolPage' }
        default: { $ref: '#/components/responses/Error' }
  /v1/interventions:
    get:
      tags: [Aggregates]
      summary: Intervention records (status and dates; titles and notes never returned)
      parameters:
        - $ref: '#/components/parameters/province_id'
        - $ref: '#/components/parameters/district_id'
        - $ref: '#/components/parameters/circuit_id'
        - $ref: '#/components/parameters/school_id'
        - { name: status, in: query, schema: { type: string, enum: [open, in_progress, resolved] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 200 } }
        - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: One page of interventions ordered by id
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string, format: uuid }
                            school_id: { type: string, format: uuid }
                            academic_year: { type: string, nullable: true }
                            subject: { type: string, nullable: true }
                            status: { type: string, enum: [open, in_progress, resolved] }
                            opened_on: { type: string, format: date }
                            target_date: { type: string, format: date, nullable: true }
                            resolved_on: { type: string, format: date, nullable: true }
                            overdue: { type: boolean }
                            learner_id: { type: string, format: uuid, nullable: true, description: Only with learner-level access. }
        default: { $ref: '#/components/responses/Error' }
  /v1/data-quality:
    get:
      tags: [Aggregates]
      summary: Data-quality issues per school
      parameters:
        - $ref: '#/components/parameters/province_id'
        - $ref: '#/components/parameters/district_id'
        - $ref: '#/components/parameters/circuit_id'
        - $ref: '#/components/parameters/school_id'
        - $ref: '#/components/parameters/academic_year'
        - $ref: '#/components/parameters/term'
        - $ref: '#/components/parameters/school_limit'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200': { $ref: '#/components/responses/SchoolPage' }
        default: { $ref: '#/components/responses/Error' }
  /v1/reports/summary:
    get:
      tags: [Reports]
      summary: Summary, districts, grades, subjects and trends for the scope
      parameters:
        - $ref: '#/components/parameters/province_id'
        - $ref: '#/components/parameters/district_id'
        - $ref: '#/components/parameters/circuit_id'
        - $ref: '#/components/parameters/school_id'
        - $ref: '#/components/parameters/academic_year'
        - $ref: '#/components/parameters/term'
        - $ref: '#/components/parameters/start_date'
        - $ref: '#/components/parameters/end_date'
        - $ref: '#/components/parameters/grade'
      responses:
        '200':
          description: Same figures as the District Dashboard
          content:
            application/json:
              schema: { type: object, properties: { data: { type: object } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/reports/schools:
    get:
      tags: [Reports]
      summary: Per-school indicators (same as Government Reports)
      parameters:
        - $ref: '#/components/parameters/province_id'
        - $ref: '#/components/parameters/district_id'
        - $ref: '#/components/parameters/circuit_id'
        - $ref: '#/components/parameters/school_id'
        - $ref: '#/components/parameters/academic_year'
        - $ref: '#/components/parameters/term'
        - $ref: '#/components/parameters/school_limit'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200': { $ref: '#/components/responses/SchoolPage' }
        default: { $ref: '#/components/responses/Error' }
  /v1/reports/provinces/{id}:
    get:
      tags: [Reports]
      summary: Provincial report (client must be scoped to this province)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/district_id'
        - $ref: '#/components/parameters/circuit_id'
        - $ref: '#/components/parameters/school_id'
        - $ref: '#/components/parameters/academic_year'
        - $ref: '#/components/parameters/term'
      responses:
        '200':
          description: Same figures as the Provincial Dashboard, without the school list
          content:
            application/json:
              schema: { type: object, properties: { data: { type: object } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/imports:
    post:
      tags: [Imports]
      summary: Validate (dry run) or submit a school-identifier import
      description: |
        Nothing is written to school records by this call. A stored import is
        committed by a platform administrator after review.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, rows]
              additionalProperties: false
              properties:
                kind: { type: string, enum: [school_identifiers] }
                dry_run: { type: boolean, default: false }
                idempotency_key: { type: string, pattern: '^[A-Za-z0-9._:-]{8,128}$', description: Required unless dry_run is true. }
                rows:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  items:
                    type: object
                    required: [school_id, emis_number]
                    additionalProperties: false
                    properties:
                      school_id: { type: string, format: uuid }
                      emis_number: { type: string, pattern: '^[A-Za-z0-9-]{1,32}$' }
      responses:
        '200': { description: Dry-run preview, or a replay of an existing job with the same key and payload }
        '201': { description: Import job stored (validated or failed) }
        default: { $ref: '#/components/responses/Error' }
  /v1/imports/{id}:
    get:
      tags: [Imports]
      summary: The client's own import job
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Import job }
        default: { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
      description: "f360g_<8 hex>_<48 hex>, issued once by a platform administrator. Not a Supabase JWT."
  parameters:
    province_id: { name: province_id, in: query, schema: { type: string, format: uuid } }
    district_id: { name: district_id, in: query, schema: { type: string, format: uuid } }
    circuit_id: { name: circuit_id, in: query, schema: { type: string, format: uuid } }
    school_id: { name: school_id, in: query, schema: { type: string, format: uuid } }
    academic_year: { name: academic_year, in: query, schema: { type: string, maxLength: 40 } }
    term: { name: term, in: query, schema: { type: integer, minimum: 1, maximum: 99 } }
    start_date: { name: start_date, in: query, schema: { type: string, format: date } }
    end_date: { name: end_date, in: query, schema: { type: string, format: date } }
    grade: { name: grade, in: query, schema: { type: string, maxLength: 60 } }
    cursor: { name: cursor, in: query, description: next_cursor from the previous page, schema: { type: string, format: uuid } }
    school_limit: { name: limit, in: query, description: Schools per page, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
  responses:
    SchoolPage:
      description: One page of per-school rows ordered by school id
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Page'
              - type: object
                properties:
                  data: { type: array, items: { type: object } }
    Error:
      description: |
        400 malformed_request, 401 unauthenticated, 403 forbidden or
        permission_not_granted, 404 not_found, 405 method_not_allowed,
        409 conflict, 413 payload_too_large, 415 unsupported_media_type,
        422 validation_failed, 429 rate_limited (Retry-After), 500 internal_error.
      headers:
        X-Request-Id: { schema: { type: string } }
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  code: { type: string }
                  message: { type: string }
                  request_id: { type: string }
  schemas:
    Permission:
      type: string
      enum: [schools, learners, attendance, assessments, staff, interventions, data_quality, reports, imports]
    Page:
      type: object
      properties:
        page:
          type: object
          properties:
            limit: { type: integer }
            next_cursor: { type: string, format: uuid, nullable: true }
    Area:
      type: object
      properties:
        id: { type: string, format: uuid }
        level: { type: string, enum: [province, district, circuit] }
        parent_id: { type: string, format: uuid, nullable: true }
        name: { type: string }
        code: { type: string, nullable: true }
        in_scope: { type: boolean }
    NamedRef:
      type: object
      nullable: true
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    School:
      type: object
      properties:
        id: { type: string, format: uuid }
        emis_number: { type: string, nullable: true }
        name: { type: string }
        status: { type: string }
        province: { $ref: '#/components/schemas/NamedRef' }
        district: { $ref: '#/components/schemas/NamedRef' }
        circuit: { $ref: '#/components/schemas/NamedRef' }
    AttendanceCounts:
      type: object
      properties:
        present: { type: integer }
        late: { type: integer }
        absent: { type: integer }
        excused: { type: integer }
        attendance_rate: { type: number, nullable: true }
