name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same branch/PR so pushes don't queue behind
# stale ones.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Production build
        # No Supabase credentials required: this is a static build (tsc +
        # vite build) — the app only reads VITE_SUPABASE_URL/ANON_KEY at
        # browser runtime (src/lib/supabase.ts), not at build time.
        run: npm run build

  rls-tests:
    name: RLS / trigger / SECURITY DEFINER regression suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # supabase/rls-tests/run.sh spins up its own disposable
      # postgres:16-alpine container with a fixed local-only harness
      # password (see the script) — no repository secrets are used or
      # required for this job.
      - name: Run RLS regression suite
        run: supabase/rls-tests/run.sh

  e2e:
    name: Playwright end-to-end suite
    runs-on: ubuntu-latest
    env:
      # The e2e suite is fully network-mocked (e2e/utils/mockAuth.ts,
      # mockData.ts intercept every Supabase call) and never reaches a real
      # project. The dev server only needs these two variables to be
      # *present* to boot — src/lib/supabase.ts checks they're non-empty,
      # it never validates them — so plain placeholders are correct here,
      # not a secret. See .env.example and the handover document's e2e
      # discovery note for the same finding this job relies on.
      VITE_SUPABASE_URL: http://localhost:54321
      VITE_SUPABASE_ANON_KEY: ci-dummy-anon-key-not-a-real-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # --with-deps also installs the OS-level libraries headless Chromium
      # needs on a bare Ubuntu runner (not just the browser binary itself).
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run e2e suite
        run: npx playwright test

      # playwright.config.ts uses the 'list' reporter (console only, no HTML
      # report generated) and `trace: 'retain-on-failure'`, so the useful
      # artifact on failure is the per-test trace under test-results/, not
      # a playwright-report/ directory (which this config never produces).
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production site
        env:
          # Temporary non-secret values allow the static UI to be deployed.
          # Replace these with the hosted Funda360 Supabase project values
          # before using authentication/data in production.
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: github-pages-placeholder-anon-key
          VITE_APP_NAME: Funda360
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
