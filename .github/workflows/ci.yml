name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same branch/PR so pushes don't queue behind
# stale ones.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Migration versions are unique
        # Supabase records one row per migration version. Two files sharing a
        # version means one of them is silently never applied to a hosted
        # project (this happened with 20260919090000 — audit 2026-09-29).
        run: |
          dupes=$(ls supabase/migrations/*.sql | xargs -n1 basename | cut -d_ -f1 | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "::error::Duplicate migration versions: $dupes"
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Source verification script tests (offline, deterministic)
        run: docs/sources/test-verify-dbe-sources.sh

      - name: Production build
        # This build is a quality gate only. The deploy job below performs the
        # real production build with the hosted Supabase configuration.
        run: npm run build

  edge-functions:
    name: Edge Function (Deno) tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Edge Functions
        working-directory: supabase/functions
        run: deno check payments-initiate/index.ts payments-webhook/index.ts admissions-public/index.ts notifications-dispatch/index.ts curriculum-ai-draft/index.ts _shared/providers/providers.test.ts _shared/providers/binding.test.ts _shared/admissions/guards.test.ts _shared/curriculum/curriculum.test.ts
      - name: Lint Edge Functions
        working-directory: supabase/functions
        run: deno lint
      - name: Payment provider adapter tests
        working-directory: supabase/functions
        run: deno test --allow-env --allow-net _shared/

  rls-tests:
    name: RLS / trigger / SECURITY DEFINER regression suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # supabase/rls-tests/run.sh spins up its own disposable
      # postgres:16-alpine container with a fixed local-only harness
      # password (see the script) — no repository secrets are used or
      # required for this job.
      - name: Run RLS regression suite
        run: supabase/rls-tests/run.sh

  e2e:
    name: Playwright end-to-end suite
    runs-on: ubuntu-latest
    env:
      # The e2e suite is fully network-mocked and never reaches a real
      # Supabase project. The dev server only needs these variables present.
      VITE_SUPABASE_URL: http://localhost:54321
      VITE_SUPABASE_ANON_KEY: ci-dummy-anon-key-not-a-real-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run e2e suite
        run: npx playwright test

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  migrate:
    # The hosted database must be at least as new as the frontend that is
    # about to be deployed. Before this job existed, migrations were applied
    # by hand and production drifted five migrations behind the deployed UI
    # (audit 2026-09-29, finding P0-2). `supabase db push` applies only the
    # migrations the remote history does not yet contain, in version order,
    # and fails the pipeline — blocking the deploy — if any of them fails.
    if: github.event_name == 'push'
    name: Apply database migrations to production
    needs: [quality, edge-functions, rls-tests, e2e]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify migration credentials
        run: |
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret $name in the github-pages environment. Production migrations cannot be applied, so the deploy is blocked."
              exit 1
            fi
          done

      - name: Link hosted project
        run: npx supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply pending migrations
        run: npx supabase db push --password "$SUPABASE_DB_PASSWORD"

      - name: Confirm no drift remains
        run: |
          npx supabase migration list --password "$SUPABASE_DB_PASSWORD" | tee migration-list.txt
          # A row with a local version but an empty remote column means the
          # push did not apply it.
          if awk -F'|' 'NR>2 && $1 ~ /[0-9]/ && $2 !~ /[0-9]/' migration-list.txt | grep -q .; then
            echo "::error::Local migrations are still missing from production after db push."
            exit 1
          fi

  deploy:
    if: github.event_name == 'push'
    name: Deploy to GitHub Pages
    needs: [quality, edge-functions, rls-tests, e2e, migrate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify production Supabase configuration
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ]; then
            echo "::error::Missing GitHub Actions secret VITE_SUPABASE_URL in the github-pages environment."
            exit 1
          fi
          if [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::Missing GitHub Actions secret VITE_SUPABASE_ANON_KEY in the github-pages environment."
            exit 1
          fi
          case "$VITE_SUPABASE_URL" in
            https://*.supabase.co) ;;
            *)
              echo "::error::VITE_SUPABASE_URL must be the hosted Supabase Project URL (https://<project-ref>.supabase.co)."
              exit 1
              ;;
          esac

      - name: Build production site
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_APP_NAME: Funda360
        run: npm run build

      - name: Verify Pages entrypoint
        run: |
          test -f dist/index.html
          # Funda360 uses BrowserRouter. GitHub Pages needs an SPA fallback
          # so direct visits/refreshes of application routes do not 404.
          cp dist/index.html dist/404.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
